<section id="project" class="relative px-4 py-20 sm:px-6 lg:px-8 lg:py-28">
  <app-section-header eyebrow="Projects" title="Featured Projects"
    subtitle="Academic and personal projects demonstrating real features, database integration, and modern web development." />

  <div class="mx-auto grid max-w-6xl grid-cols-1 gap-6 md:grid-cols-2">
    @for (p of projects; track p.title; let i = $index) {
    <article appReveal="up" [revealDelay]="(i % 2) * 120"
      class="group flex flex-col overflow-hidden rounded-2xl border border-border bg-surface/60 backdrop-blur transition-all duration-300 hover:-translate-y-1.5 hover:border-primary/30 hover:shadow-card">

      <div class="relative overflow-hidden">
        <img [src]="p.image" [alt]="p.title + ' preview'" loading="lazy" width="1919" height="913"
          class="aspect-video w-full object-cover transition-transform duration-500 group-hover:scale-[1.05]" />

        <div
          class="absolute inset-0 flex items-center justify-center gap-3 bg-gradient-to-t from-bg/90 via-bg/30 to-transparent opacity-0 backdrop-blur-[2px] transition-opacity duration-300 group-hover:opacity-100">
          @if (p.liveUrl) {
          <a [href]="p.liveUrl" target="_blank" rel="noopener noreferrer"
            class="rounded-lg bg-white px-4 py-2 text-sm font-semibold text-slate-900 shadow-lg transition-transform duration-300 hover:scale-105">
            Live Demo
          </a>
          }
          <a [href]="p.codeUrl" target="_blank" rel="noopener noreferrer"
            class="flex items-center gap-1.5 rounded-lg bg-slate-950/70 px-4 py-2 text-sm font-semibold text-white backdrop-blur transition-transform duration-300 hover:scale-105">
            <i class="bi bi-github" aria-hidden="true"></i>
            GitHub
          </a>
        </div>
      </div>

      <div class="flex flex-1 flex-col p-6">
        <div class="flex items-start justify-between gap-3">
          <h3 class="font-display text-xl font-bold tracking-tight text-text">{{ p.title }}</h3>
          <span class="shrink-0 rounded-full border border-border bg-elevated px-2.5 py-1 text-xs font-medium text-muted">
            {{ p.year }}
          </span>
        </div>

        <p class="mt-2 line-clamp-3 text-sm leading-relaxed text-muted">{{ p.description }}</p>

        <div class="mt-4 flex flex-wrap gap-2">
          @for (t of p.techs; track t) {
          <span
            class="rounded-full border border-border bg-elevated px-3 py-1 text-xs font-medium text-text/80 transition-colors duration-200 hover:border-primary/40 hover:text-primary">
            {{ t }}
          </span>
          }
        </div>

        <div class="mt-5 flex gap-3 pt-1">
          <a [href]="p.codeUrl" target="_blank" rel="noopener noreferrer"
            class="inline-flex flex-1 items-center justify-center gap-2 rounded-xl border border-border bg-surface px-4 py-2.5 text-sm font-semibold text-text transition-all duration-300 hover:-translate-y-0.5 hover:border-primary/40 hover:text-primary">
            <i class="bi bi-github" aria-hidden="true"></i>
            Code
          </a>

          @if (p.liveUrl) {
          <a [href]="p.liveUrl" target="_blank" rel="noopener noreferrer"
            class="inline-flex flex-1 items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-primary to-accent px-4 py-2.5 text-sm font-semibold text-white shadow-glow transition-all duration-300 hover:-translate-y-0.5 hover:brightness-110">
            <i class="bi bi-box-arrow-up-right" aria-hidden="true"></i>
            Live Demo
          </a>
          }
        </div>
      </div>
    </article>
    }
  </div>
</section>
