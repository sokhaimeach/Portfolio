<div class="mb-12 md:mb-16" appReveal="up">
  <div class="flex items-center justify-center gap-3">
    <span class="h-px w-8 bg-gradient-to-r from-transparent to-primary" aria-hidden="true"></span>
    <span class="text-xs font-semibold uppercase tracking-[0.25em] text-primary">{{ eyebrow }}</span>
    <span class="h-px w-8 bg-gradient-to-l from-transparent to-primary" aria-hidden="true"></span>
  </div>
  <h2 class="mt-4 text-center font-display text-3xl font-bold tracking-tight text-text sm:text-4xl md:text-[2.75rem] md:leading-tight">
    {{ title }}
  </h2>
  @if (subtitle) {
  <p class="mx-auto mt-4 max-w-2xl text-center leading-relaxed text-muted">{{ subtitle }}</p>
  }
</div>
