<section id="education" class="relative px-4 py-20 sm:px-6 lg:px-8 lg:py-28">
  <app-section-header eyebrow="Education" title="Education & Academic Background"
    subtitle="My academic background at SETEC Institute and foundation in Management Information Systems." />

  <div class="mx-auto max-w-3xl space-y-6">
    @for (e of education; track e.degree; let i = $index) {
    <article appReveal="up" [revealDelay]="i * 120"
      class="group flex flex-col gap-5 rounded-2xl border border-border bg-surface/60 p-6 backdrop-blur transition-all duration-300 hover:-translate-y-1 hover:border-primary/30 hover:shadow-card sm:flex-row sm:items-start sm:gap-6">
      <div
        class="flex size-12 shrink-0 items-center justify-center rounded-xl bg-gradient-to-br from-primary/20 to-accent/20 text-xl text-primary">
        <i class="bi bi-mortarboard-fill" aria-hidden="true"></i>
      </div>

      <div class="flex-1">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <h3 class="font-display text-lg font-bold tracking-tight text-text">{{ e.degree }}</h3>
          <span class="rounded-full border border-border bg-elevated px-3 py-1 text-xs font-medium text-muted">
            {{ e.period }}
          </span>
        </div>

        <p class="mt-1 text-sm font-semibold text-primary">{{ e.school }}</p>
        <p class="mt-3 text-sm leading-relaxed text-muted">{{ e.detail }}</p>
      </div>
    </article>
    }
  </div>
</section>
