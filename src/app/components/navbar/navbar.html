<header
  class="sticky top-0 z-50 w-full border-b border-border/60 bg-bg/70 backdrop-blur-xl transition-shadow duration-300"
  [class.shadow-card]="scrolled()">
  <nav class="mx-auto flex h-16 max-w-6xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8" aria-label="Main navigation">
    <!-- Logo -->
    <a href="#home" (click)="select('home')"
      class="group flex shrink-0 items-center gap-2.5 font-display text-lg font-bold tracking-tight text-text">
      <span aria-hidden="true"
        class="flex size-8 items-center justify-center rounded-lg bg-gradient-to-br from-primary to-accent text-sm font-bold text-white shadow-glow transition-transform duration-300 group-hover:rotate-6 group-hover:scale-105">
        S
      </span>
      sokhai.dev
    </a>

    <!-- Desktop links -->
    <ul class="hidden items-center gap-0.5 lg:flex">
      @for (s of sections; track s) {
      <li>
        <a href="#{{ s }}" (click)="select(s)"
          [attr.aria-current]="active === s ? 'true' : null"
          [class.text-primary]="active === s"
          [class.text-muted]="active !== s"
          [class.after:scale-x-100]="active === s"
          [class.after:scale-x-0]="active !== s"
          class="relative rounded-md px-3 py-2 text-sm font-medium transition-colors duration-200 hover:text-text after:absolute after:inset-x-3 after:bottom-0.5 after:h-0.5 after:origin-center after:rounded-full after:bg-gradient-to-r after:from-primary after:to-accent after:transition-transform after:duration-300">
          {{ labels[s] }}
        </a>
      </li>
      }
    </ul>

    <!-- Right actions -->
    <div class="flex shrink-0 items-center gap-2">
      <button type="button" (click)="toggleTheme.emit()"
        [attr.aria-label]="theme === 'dark' ? 'Switch to light mode' : 'Switch to dark mode'"
        class="flex size-9 items-center justify-center rounded-lg border border-border text-muted transition-all duration-300 hover:border-primary/40 hover:text-primary">
        @if (theme === 'dark') {
        <i class="bi bi-sun" aria-hidden="true"></i>
        } @else {
        <i class="bi bi-moon-stars" aria-hidden="true"></i>
        }
      </button>

      <a href="assets/cv.pdf"
        target="_blank" rel="noopener noreferrer"
        class="hidden items-center gap-2 rounded-lg bg-gradient-to-r from-primary to-accent px-4 py-2 text-sm font-semibold text-white shadow-glow transition-all duration-300 hover:-translate-y-0.5 hover:brightness-110 sm:inline-flex">
        <i class="bi bi-file-earmark-text" aria-hidden="true"></i>
        Resume
      </a>

      <!-- Hamburger -->
      <button type="button" (click)="menuOpen.set(!menuOpen())" aria-controls="mobile-menu"
        [attr.aria-expanded]="menuOpen()" aria-label="Toggle navigation menu"
        class="flex size-9 items-center justify-center rounded-lg border border-border text-muted transition-colors duration-200 hover:border-primary/40 hover:text-primary lg:hidden">
        <i class="bi text-lg" [class.bi-list]="!menuOpen()" [class.bi-x-lg]="menuOpen()" aria-hidden="true"></i>
      </button>
    </div>
  </nav>
</header>

<!-- Mobile menu -->
<div id="mobile-menu" class="fixed inset-0 z-40 lg:hidden"
  [class.pointer-events-none]="!menuOpen()">
  <div class="absolute inset-0 bg-bg/95 backdrop-blur-2xl transition-opacity duration-300"
    [class.opacity-100]="menuOpen()"
    [class.opacity-0]="!menuOpen()"></div>

  <nav class="relative flex h-full flex-col items-center justify-center gap-1 px-8" aria-label="Mobile navigation">
    @for (s of sections; track s; let i = $index) {
    <a href="#{{ s }}" (click)="select(s)"
      [attr.aria-current]="active === s ? 'true' : null"
      [class.text-primary]="active === s"
      [class.text-muted]="active !== s"
      [class.translate-y-0]="menuOpen()"
      [class.translate-y-4]="!menuOpen()"
      [class.opacity-100]="menuOpen()"
      [class.opacity-0]="!menuOpen()"
      [style.transition-delay]="menuOpen() ? (60 * i) + 'ms' : '0ms'"
      class="py-2.5 font-display text-3xl font-semibold transition-all duration-300 hover:scale-105 hover:text-primary">
      {{ labels[s] }}
    </a>
    }

    <a href="assets/cv.pdf" target="_blank" rel="noopener noreferrer" (click)="menuOpen.set(false)"
      [class.translate-y-0]="menuOpen()"
      [class.translate-y-4]="!menuOpen()"
      [class.opacity-100]="menuOpen()"
      [class.opacity-0]="!menuOpen()"
      [style.transition-delay]="menuOpen() ? (60 * sections.length) + 'ms' : '0ms'"
      class="mt-8 inline-flex items-center gap-2 rounded-lg bg-gradient-to-r from-primary to-accent px-6 py-3 font-semibold text-white shadow-glow transition-all duration-300 hover:brightness-110">
      <i class="bi bi-file-earmark-text" aria-hidden="true"></i>
      View CV
    </a>
  </nav>
</div>
